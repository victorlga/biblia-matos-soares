name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install iOS Simulator runtime
        run: |
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && exit 0
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "All attempts to download iOS simulator failed"
          exit 1

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Prepare Firebase config
        run: cp GoogleService-Info.plist.template GoogleService-Info.plist

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -project biblia-matos-soares.xcodeproj \
            -scheme biblia-matos-soares \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Determine simulator
        id: sim
        run: |
          SIMULATOR_NAME=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed 's/^ *//' | sed 's/ (.*//')
          echo "name=$SIMULATOR_NAME" >> $GITHUB_OUTPUT
          echo "Using simulator: $SIMULATOR_NAME"

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project biblia-matos-soares.xcodeproj \
            -scheme biblia-matos-soares \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
